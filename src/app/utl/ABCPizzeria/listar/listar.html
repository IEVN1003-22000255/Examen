<div class="bg-center min-h-screen bg-no-repeat bg-[url('https://images.unsplash.com/photo-1513104890138-7c749659a591')] bg-cover bg-dark bg-blend-multiply p-6">
  <div class="max-w-4xl mx-auto">
    <div class="flex justify-center mb-8">
      <h1 class="bg-gray-100 text-gray-900 text-4xl font-bold italic px-4 py-1 border border-gray-300 rounded-lg">Lista de Pedidos</h1>
    </div>

    <fieldset class="border-4 border-white/90 rounded-lg p-5 text-white">
      <div class="relative overflow-x-auto rounded-lg">
        <table class="w-full text-sm text-left text-gray-900">
          <thead class="text-xs text-gray-900 uppercase bg-gray-100">
            <tr>
              <th class="px-6 py-3">Nombre</th>
              <th class="px-6 py-3">Dirección</th>
              <th class="px-6 py-3">Teléfono</th>
              <th class="px-6 py-3">Total</th>
              <th class="px-6 py-3">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let pedido of pedidos" class="bg-gray-50 border-b border-gray-300">
              <td class="px-6 py-4 font-medium">{{ pedido.nombre }}</td>
              <td class="px-6 py-4">{{ pedido.direccion }}</td>
              <td class="px-6 py-4">{{ pedido.telefono }}</td>
              <td class="px-6 py-4 font-bold">${{ pedido.total }}</td>
              <td class="px-6 py-4 flex gap-2">
                <button type="button" class="px-3 py-1 text-white bg-blue-600 rounded" (click)="irEditar(pedido)">Editar</button>
                <button type="button" class="px-3 py-1 text-white bg-red-600 rounded" (click)="eliminar(pedido.id!)">Eliminar</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="mt-4">
        <button type="button" class="text-gray-900 bg-gray-100 font-medium rounded-lg text-sm px-5 py-2.5" (click)="volver()">Volver</button>
      </div>
    </fieldset>
  </div>
</div>
